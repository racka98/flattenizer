[package]
name = "flattenizer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35"
egui = "0.35"
rfd = "0.17.2"
ignore = "0.4.21"
ureq = { version = "2.12", features = ["tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"   # optimize for size
lto = true
codegen-units = 1
strip = true
panic = "abort"
